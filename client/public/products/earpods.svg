<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="earpodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="earpodShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="210" fill="#f8fafc" opacity="0.8"/>

  <g filter="url(#earpodShadow)">
    <!-- Elegant White Audio Cables in Fluid Curves -->
    <path d="M 180,180 C 180,260 230,270 250,300 L 250,380" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <path d="M 320,180 C 320,260 270,270 250,300" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

    <!-- Left EarPod -->
    <g transform="translate(180, 140)">
      <ellipse cx="0" cy="0" rx="26" ry="22" fill="url(#earpodGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
      <!-- Speaker Acoustic Port -->
      <ellipse cx="6" cy="-2" rx="10" ry="7" fill="#1e293b"/>
      <!-- Side Bass Vent -->
      <ellipse cx="-16" cy="-2" rx="4" ry="2" fill="#475569"/>
      <!-- Stem -->
      <path d="M -8,12 L -6,45 C -6,50 -2,50 0,45 L 4,12 Z" fill="url(#earpodGrad)" stroke="#cbd5e1" stroke-width="1"/>
      <text x="-12" y="32" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#94a3b8">L</text>
    </g>

    <!-- Right EarPod -->
    <g transform="translate(320, 140)">
      <ellipse cx="0" cy="0" rx="26" ry="22" fill="url(#earpodGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
      <ellipse cx="-6" cy="-2" rx="10" ry="7" fill="#1e293b"/>
      <ellipse cx="16" cy="-2" rx="4" ry="2" fill="#475569"/>
      <path d="M 8,12 L 6,45 C 6,50 2,50 0,45 L -4,12 Z" fill="url(#earpodGrad)" stroke="#cbd5e1" stroke-width="1"/>
      <text x="7" y="32" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#94a3b8">R</text>
    </g>

    <!-- Inline Remote Control with Volume Buttons -->
    <rect x="238" y="270" width="24" height="52" rx="12" fill="url(#earpodGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="250" cy="282" r="3" fill="#cbd5e1"/>
    <rect x="246" y="294" width="8" height="4" rx="2" fill="#94a3b8"/>
    <circle cx="250" cy="310" r="3" fill="#cbd5e1"/>

    <!-- Lightning / Type-C Metal Connector Plug -->
    <rect x="242" y="380" width="16" height="24" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <rect x="245" y="404" width="10" height="14" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

    <!-- Badge -->
    <rect x="195" y="430" width="110" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="250" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">APPLE EARPODS</text>
  </g>
</svg>
