<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="earBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="earpodWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
    <filter id="earShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f5f5f4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#earBg)"/>

  <!-- Wired EarPods -->
  <g filter="url(#earShadow)">
    <!-- Cable Wire Flowing -->
    <path d="M 300,530 C 300,450 250,380 230,300 C 215,240 220,180 220,150" fill="none" stroke="#e7e5e4" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 300,530 C 300,450 350,380 370,300 C 385,240 380,180 380,150" fill="none" stroke="#e7e5e4" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Left EarPod Head -->
    <g transform="translate(220, 150) rotate(-15)">
      <!-- Stem -->
      <rect x="-8" y="0" width="16" height="55" rx="8" fill="url(#earpodWhite)" stroke="#e7e5e4" stroke-width="1"/>
      <!-- Acoustic Head -->
      <ellipse cx="14" cy="-12" rx="28" ry="24" fill="url(#earpodWhite)" stroke="#e7e5e4" stroke-width="1"/>
      <!-- Speaker Mesh -->
      <ellipse cx="26" cy="-12" rx="10" ry="14" fill="#57534e"/>
      <ellipse cx="10" cy="-24" rx="6" ry="4" fill="#78716c"/>
    </g>

    <!-- Right EarPod Head -->
    <g transform="translate(380, 150) rotate(15)">
      <!-- Stem -->
      <rect x="-8" y="0" width="16" height="55" rx="8" fill="url(#earpodWhite)" stroke="#e7e5e4" stroke-width="1"/>
      <!-- Acoustic Head -->
      <ellipse cx="-14" cy="-12" rx="28" ry="24" fill="url(#earpodWhite)" stroke="#e7e5e4" stroke-width="1"/>
      <!-- Speaker Mesh -->
      <ellipse cx="-26" cy="-12" rx="10" ry="14" fill="#57534e"/>
      <ellipse cx="-10" cy="-24" rx="6" ry="4" fill="#78716c"/>
    </g>

    <!-- Inline Remote / Mic -->
    <g transform="translate(208, 250) rotate(-5)">
      <rect x="0" y="0" width="16" height="60" rx="8" fill="url(#earpodWhite)" stroke="#d6d3d1" stroke-width="1"/>
      <circle cx="8" cy="18" r="3" fill="#a8a29e"/>
      <rect x="5" y="28" width="6" height="12" rx="2" fill="#78716c"/>
      <circle cx="8" cy="48" r="3" fill="#a8a29e"/>
    </g>

    <!-- Lightning / USB-C Connector -->
    <g transform="translate(288, 510)">
      <rect x="0" y="0" width="24" height="42" rx="6" fill="url(#earpodWhite)" stroke="#d6d3d1" stroke-width="1"/>
      <rect x="4" y="38" width="16" height="25" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <line x1="8" y1="46" x2="16" y2="46" stroke="#475569" stroke-width="2"/>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(420, 80)">
    <rect width="130" height="36" rx="18" fill="#44403c" stroke="#78716c" stroke-width="1"/>
    <text x="65" y="23" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PURE AUDIO</text>
  </g>
</svg>
