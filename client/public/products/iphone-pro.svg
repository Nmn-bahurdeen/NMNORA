<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Blue Pro Finish -->
    <linearGradient id="proBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="proRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <radialGradient id="proLens" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="proShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient Light Backdrop Glow -->
  <circle cx="250" cy="250" r="210" fill="#eff6ff" opacity="0.7"/>

  <!-- Phone Body -->
  <g filter="url(#proShadow)">
    <rect x="145" y="55" width="210" height="390" rx="42" fill="url(#proRim)" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="149" y="59" width="202" height="382" rx="38" fill="url(#proBody)"/>

    <!-- Specular Light Sheen -->
    <path d="M 155,65 L 330,65 L 155,370 Z" fill="#ffffff" opacity="0.12"/>

    <!-- Camera Plateau -->
    <rect x="160" y="70" width="105" height="108" rx="28" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95"/>

    <!-- Lens 1 (Top Left) -->
    <circle cx="192" cy="102" r="20" fill="#334155" stroke="#60a5fa" stroke-width="1.2"/>
    <circle cx="192" cy="102" r="16" fill="#020617"/>
    <circle cx="192" cy="102" r="13" fill="url(#proLens)"/>
    <circle cx="188" cy="98" r="3.5" fill="#ffffff" opacity="0.8"/>

    <!-- Lens 2 (Bottom Left) -->
    <circle cx="192" cy="144" r="20" fill="#334155" stroke="#60a5fa" stroke-width="1.2"/>
    <circle cx="192" cy="144" r="16" fill="#020617"/>
    <circle cx="192" cy="144" r="13" fill="url(#proLens)"/>
    <circle cx="188" cy="140" r="3.5" fill="#ffffff" opacity="0.8"/>

    <!-- Lens 3 (Right Center) -->
    <circle cx="234" cy="123" r="20" fill="#334155" stroke="#60a5fa" stroke-width="1.2"/>
    <circle cx="234" cy="123" r="16" fill="#020617"/>
    <circle cx="234" cy="123" r="13" fill="url(#proLens)"/>
    <circle cx="230" cy="119" r="3.5" fill="#ffffff" opacity="0.8"/>

    <!-- Flash -->
    <circle cx="234" cy="90" r="7" fill="#fef08a" stroke="#eab308" stroke-width="0.8"/>
    <!-- LiDAR -->
    <circle cx="234" cy="156" r="5" fill="#020617" stroke="#475569" stroke-width="0.8"/>

    <!-- Silver Apple Logo -->
    <g transform="translate(250, 260) scale(0.9)">
      <path d="M -3,-33 C -1,-37 2,-40 7,-41 C 5,-36 2,-33 -3,-33 Z M 9,-30 C 5,-30 2,-28 -1,-28 C -4,-28 -6,-30 -10,-30 C -17,-30 -22,-24 -22,-13 C -22,-3 -15,8 -8,8 C -5,8 -3,6 0,6 C 3,6 5,8 8,8 C 14,8 20,-2 21,-7 C 15,-10 14,-19 19,-23 C 16,-28 12,-30 9,-30 Z"
        fill="#ffffff"
        opacity="0.85"
      />
    </g>

    <!-- Model Label Badge -->
    <rect x="205" y="415" width="90" height="16" rx="8" fill="#1e293b" opacity="0.9" stroke="#3b82f6"/>
    <text x="250" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">IPHONE PRO</text>
  </g>
</svg>
