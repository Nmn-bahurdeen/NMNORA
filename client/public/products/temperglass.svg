<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glassShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="210" fill="#f0fdf4" opacity="0.7"/>

  <g filter="url(#glassShadow)">
    <!-- Base Phone Outline Behind Glass -->
    <rect x="155" y="65" width="190" height="370" rx="38" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="160" y="70" width="180" height="360" rx="34" fill="#0f172a"/>

    <!-- Floating 9H Tempered Glass Sheet Layer with Cyan Arc -->
    <rect x="140" y="50" width="220" height="400" rx="42" fill="url(#glassSheen)" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Dynamic Island / Speaker Notch Cutout -->
    <rect x="220" y="62" width="60" height="18" rx="9" fill="#0f172a" stroke="#67e8f9" stroke-width="1.5"/>

    <!-- Diagonal Glass Reflective Prism Beam -->
    <polygon points="145,55 240,55 350,390 255,390" fill="#ffffff" opacity="0.28"/>
    <polygon points="260,55 310,55 355,190 305,190" fill="#67e8f9" opacity="0.3"/>

    <!-- 9H Hardness Badge Diamond -->
    <g transform="translate(250, 240)">
      <polygon points="0,-28 28,0 0,28 -28,0" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">9H</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#0284c7" text-anchor="middle" letter-spacing="1">TEMPERED GLASS</text>
    </g>

    <!-- Edge Oleophobic coating ring -->
    <rect x="190" y="415" width="120" height="18" rx="9" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
    <text x="250" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#0284c7" text-anchor="middle" letter-spacing="0.5">SAPPHIRE ANTI-SCRATCH</text>
  </g>
</svg>
