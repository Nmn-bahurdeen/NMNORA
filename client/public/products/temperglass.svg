<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="tgBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020e17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="tgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#tgBg)"/>

  <!-- Tempered Glass Sheet Floating in 3D -->
  <g filter="url(#tgShadow)" transform="translate(180, 80)">
    <!-- Base Phone Outline Behind -->
    <rect x="-10" y="10" width="240" height="420" rx="42" fill="#0f172a" stroke="#1e293b" stroke-width="2" opacity="0.6"/>

    <!-- Glass Layer (Raised) -->
    <rect x="0" y="0" width="240" height="420" rx="40" fill="url(#glassShine)" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Black Border Edge (Curved 2.5D) -->
    <rect x="4" y="4" width="232" height="412" rx="36" fill="none" stroke="#000000" stroke-width="4" opacity="0.85"/>

    <!-- Dynamic Island / Speaker Cutout -->
    <rect x="80" y="16" width="80" height="24" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="1"/>

    <!-- Diagonal Glass Glare Reflection -->
    <path d="M 20,40 L 200,40 L 40,400 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M 60,40 L 100,40 L 20,300 Z" fill="#ffffff" opacity="0.25"/>

    <!-- 9H Hardness Badge -->
    <g transform="translate(45, 180)">
      <circle cx="75" cy="75" r="52" fill="#0284c7" opacity="0.2"/>
      <polygon points="75,35 115,55 115,100 75,120 35,100 35,55" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <text x="75" y="83" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">9H</text>
      <text x="75" y="100" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#7dd3fc" text-anchor="middle">HARDNESS</text>
    </g>
  </g>

  <!-- Feature Tags -->
  <g transform="translate(70, 520)">
    <rect width="130" height="32" rx="16" fill="#0369a1" opacity="0.8"/>
    <text x="65" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ANTI-SCRATCH</text>
  </g>
  <g transform="translate(225, 520)">
    <rect width="140" height="32" rx="16" fill="#0284c7" opacity="0.8"/>
    <text x="70" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HD ULTRA CLEAR</text>
  </g>
  <g transform="translate(390, 520)">
    <rect width="140" height="32" rx="16" fill="#0369a1" opacity="0.8"/>
    <text x="70" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BUBBLE FREE</text>
  </g>
</svg>
