<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Titanium Body Gradient -->
    <linearGradient id="promaxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Natural Titanium Rim -->
    <linearGradient id="promaxRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Glass Matte Back Plate -->
    <linearGradient id="promaxGlass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Camera Plateau -->
    <linearGradient id="plateauGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Camera Lens Reflections -->
    <radialGradient id="promaxLens" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Light Backdrop Glow (Transparent center) -->
  <circle cx="250" cy="250" r="210" fill="#f1f5f9" opacity="0.6"/>

  <!-- Phone Body with Shadow -->
  <g filter="url(#phoneShadow)">
    <!-- Outer Titanium Chiseled Frame -->
    <rect x="135" y="45" width="230" height="410" rx="46" fill="url(#promaxRim)" stroke="#ffffff" stroke-width="2"/>

    <!-- Matte Textured Back Glass -->
    <rect x="139" y="49" width="222" height="402" rx="42" fill="url(#promaxGlass)"/>

    <!-- Light Reflection Sheen Angle -->
    <path d="M 145,55 L 340,55 L 145,390 Z" fill="#ffffff" opacity="0.4"/>

    <!-- Camera Island Plateau (Rounded Square) -->
    <rect x="152" y="62" width="115" height="118" rx="32" fill="url(#plateauGrad)" stroke="#ffffff" stroke-width="1.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))"/>

    <!-- Lens 1: Top Left (Main 48MP) -->
    <circle cx="187" cy="98" r="23" fill="#cbd5e1" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="187" cy="98" r="19" fill="#0f172a"/>
    <circle cx="187" cy="98" r="15" fill="url(#promaxLens)"/>
    <circle cx="183" cy="94" r="4.5" fill="#ffffff" opacity="0.75"/>

    <!-- Lens 2: Bottom Left (Ultra Wide) -->
    <circle cx="187" cy="144" r="23" fill="#cbd5e1" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="187" cy="144" r="19" fill="#0f172a"/>
    <circle cx="187" cy="144" r="15" fill="url(#promaxLens)"/>
    <circle cx="183" cy="140" r="4.5" fill="#ffffff" opacity="0.75"/>

    <!-- Lens 3: Right Center (Periscope Telephoto) -->
    <circle cx="233" cy="121" r="23" fill="#cbd5e1" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="233" cy="121" r="19" fill="#0f172a"/>
    <circle cx="233" cy="121" r="15" fill="url(#promaxLens)"/>
    <circle cx="229" cy="117" r="4.5" fill="#ffffff" opacity="0.75"/>

    <!-- TrueTone Flash (Top Right) -->
    <circle cx="233" cy="84" r="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="233" cy="84" r="4" fill="#ffffff"/>

    <!-- LiDAR Sensor (Bottom Right) -->
    <circle cx="233" cy="158" r="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

    <!-- Shimmering Apple Logo -->
    <g transform="translate(250, 260) scale(0.95)">
      <path d="M -3,-33 C -1,-37 2,-40 7,-41 C 5,-36 2,-33 -3,-33 Z M 9,-30 C 5,-30 2,-28 -1,-28 C -4,-28 -6,-30 -10,-30 C -17,-30 -22,-24 -22,-13 C -22,-3 -15,8 -8,8 C -5,8 -3,6 0,6 C 3,6 5,8 8,8 C 14,8 20,-2 21,-7 C 15,-10 14,-19 19,-23 C 16,-28 12,-30 9,-30 Z"
        fill="#475569"
        opacity="0.75"
        filter="drop-shadow(0 1px 2px rgba(255,255,255,0.8))"
      />
    </g>

    <!-- Titanium Model Label Badge at Bottom -->
    <rect x="200" y="420" width="100" height="18" rx="9" fill="#ffffff" opacity="0.9" stroke="#e2e8f0"/>
    <text x="250" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">TITANIUM PRO MAX</text>
  </g>
</svg>
