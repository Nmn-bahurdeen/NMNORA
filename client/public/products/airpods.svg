<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="airBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="podWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="podShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#airBg)"/>

  <!-- Charging Case and Floating Pods -->
  <g filter="url(#podShadow)">
    <!-- Wireless Charging Case -->
    <g transform="translate(190, 260)">
      <rect x="0" y="0" width="220" height="170" rx="60" fill="url(#podWhite)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Lid Seam Line -->
      <line x1="0" y1="52" x2="220" y2="52" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Status LED -->
      <circle cx="110" cy="88" r="4" fill="#22c55e" filter="drop-shadow(0 0 6px #22c55e)"/>
      <!-- Lid Lip Cutout -->
      <path d="M 98,52 C 98,56 122,56 122,52 Z" fill="#94a3b8"/>
    </g>

    <!-- Left AirPod Floating in 3D -->
    <g transform="translate(180, 150) rotate(-22)">
      <!-- Short Stem -->
      <rect x="-8" y="0" width="16" height="62" rx="8" fill="url(#podWhite)" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="-6" y="52" width="12" height="6" rx="2" fill="#cbd5e1"/>
      <!-- In-Ear Head -->
      <ellipse cx="16" cy="-14" rx="26" ry="24" fill="url(#podWhite)" stroke="#cbd5e1" stroke-width="1"/>
      <ellipse cx="32" cy="-14" rx="12" ry="16" fill="#cbd5e1"/>
      <!-- Black Acoustic Vent -->
      <rect x="-4" y="-12" width="6" height="16" rx="3" fill="#1e293b"/>
    </g>

    <!-- Right AirPod Floating in 3D -->
    <g transform="translate(420, 150) rotate(22)">
      <!-- Short Stem -->
      <rect x="-8" y="0" width="16" height="62" rx="8" fill="url(#podWhite)" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="-6" y="52" width="12" height="6" rx="2" fill="#cbd5e1"/>
      <!-- In-Ear Head -->
      <ellipse cx="-16" cy="-14" rx="26" ry="24" fill="url(#podWhite)" stroke="#cbd5e1" stroke-width="1"/>
      <ellipse cx="-32" cy="-14" rx="12" ry="16" fill="#cbd5e1"/>
      <!-- Black Acoustic Vent -->
      <rect x="-2" y="-12" width="6" height="16" rx="3" fill="#1e293b"/>
    </g>
  </g>

  <!-- Sound Waves Graphic -->
  <path d="M 100,120 A 40,40 0 0,0 100,180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 80,105 A 60,60 0 0,0 80,195" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 500,120 A 40,40 0 0,1 500,180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 520,105 A 60,60 0 0,1 520,195" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Badge -->
  <g transform="translate(230, 480)">
    <rect width="140" height="36" rx="18" fill="#0284c7" opacity="0.9"/>
    <text x="70" y="23" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">SPATIAL AUDIO</text>
  </g>
</svg>
