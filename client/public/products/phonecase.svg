<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="caseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.8"/>
    </radialGradient>

    <filter id="caseShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="210" fill="#f8fafc" opacity="0.8"/>

  <g filter="url(#caseShadow)">
    <!-- Shockproof Reinforced Corners -->
    <rect x="140" y="50" width="220" height="400" rx="46" fill="#f1f5f9" stroke="url(#caseBorder)" stroke-width="3"/>
    <!-- Crystal Clear Inner PC Backplate -->
    <rect x="146" y="56" width="208" height="388" rx="40" fill="#ffffff" opacity="0.85"/>

    <!-- Subtle Frost Diagonal Shimmer -->
    <path d="M 150,60 L 330,60 L 150,380 Z" fill="#38bdf8" opacity="0.08"/>

    <!-- Camera Bezel Ring Guard -->
    <rect x="160" y="68" width="105" height="110" rx="28" fill="#e2e8f0" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    <circle cx="190" cy="100" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="190" cy="144" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="232" cy="122" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- MagSafe Magnetic Array Ring -->
    <circle cx="250" cy="265" r="58" fill="none" stroke="#64748b" stroke-width="7" stroke-dasharray="14 3" opacity="0.65"/>
    <circle cx="250" cy="265" r="58" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 3" opacity="0.9"/>
    <!-- Bottom alignment pill magnet -->
    <rect x="246" y="332" width="8" height="24" rx="4" fill="#64748b" opacity="0.7"/>

    <!-- Brand badge -->
    <rect x="200" y="415" width="100" height="18" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="250" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">MAGSAFE ARMOR</text>
  </g>
</svg>
