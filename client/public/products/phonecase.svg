<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="caseBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1b3d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0512" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#190624"/>
    </linearGradient>
    <filter id="caseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#a855f7" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#caseBg)"/>

  <!-- Phone Case -->
  <g filter="url(#caseShadow)" transform="translate(170, 70)">
    <!-- Shockproof Outer Bumper -->
    <rect x="-6" y="-6" width="272" height="472" rx="54" fill="#a855f7" opacity="0.6"/>
    <!-- Heavy-Duty Case Shell -->
    <rect x="0" y="0" width="260" height="460" rx="50" fill="url(#leatherGrad)" stroke="#c084fc" stroke-width="2"/>

    <!-- Camera Bevel Guard Ring -->
    <rect x="18" y="18" width="130" height="135" rx="36" fill="#12061c" stroke="#e9d5ff" stroke-width="2.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.6))"/>

    <!-- Cutout for 3 Pro Lenses -->
    <circle cx="58" cy="58" r="22" fill="#000000" stroke="#7e22ce" stroke-width="2"/>
    <circle cx="58" cy="112" r="22" fill="#000000" stroke="#7e22ce" stroke-width="2"/>
    <circle cx="106" cy="85" r="22" fill="#000000" stroke="#7e22ce" stroke-width="2"/>

    <!-- MagSafe Magnetic Ring -->
    <g transform="translate(130, 260)">
      <circle cx="0" cy="0" r="68" fill="none" stroke="#e9d5ff" stroke-width="6" opacity="0.85"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6,4"/>
      <!-- Alignment Dash Bar -->
      <line x1="0" y1="74" x2="0" y2="105" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- Corner Airbag Drop Cushions -->
    <circle cx="20" cy="20" r="10" fill="#a855f7" opacity="0.4"/>
    <circle cx="240" cy="20" r="10" fill="#a855f7" opacity="0.4"/>
    <circle cx="20" cy="440" r="10" fill="#a855f7" opacity="0.4"/>
    <circle cx="240" cy="440" r="10" fill="#a855f7" opacity="0.4"/>
  </g>

  <!-- MagSafe Compatibility Badge -->
  <g transform="translate(390, 485)">
    <rect width="145" height="38" rx="19" fill="#9333ea" opacity="0.95"/>
    <text x="72.5" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">⚡ MAGSAFE READY</text>
  </g>
</svg>
